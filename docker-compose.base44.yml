# Base44 sandbox dev environment for Horizon Properties.
#
# Runs the Next.js app from the cloned source (bind-mounted) with the dev server so
# edits hot-reload into the preview. No external services or credentials are required.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Bind mounts do not always emit inotify events inside containers — poll instead.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Passed through from the platform so next.config.mjs can whitelist the
      # preview origin for dev assets / HMR (see allowedDevOrigins).
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
  next_cache:
